name: O Seu Radar — produção de YouTube Shorts

on:
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Janela de notícias recentes para selecionar uma pauta (horas)"
        required: true
        default: "36"
        type: string
      max_articles:
        description: "Máximo de notícias candidatas para selecionar uma pauta"
        required: true
        default: "40"
        type: string

permissions:
  contents: read

concurrency:
  group: radar-diario-video
  cancel-in-progress: false

jobs:
  produce:
    name: Gerar Short vertical, roteiro, áudio e imagem
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
      PIPER_API_KEY: ${{ secrets.PIPER_API_KEY }}
      PIPER_API_URL: "https://radar-ia-1.onrender.com/api/tts"
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar FFmpeg, fontes e bibliotecas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow

      - name: Validar credenciais necessárias
        run: |
          test -n "$GEMINI_API_KEY" || (echo "::error::Configure GEMINI_API_KEY nos Secrets do GitHub." && exit 1)
          test -n "$PIPER_API_KEY" || (echo "::error::Configure PIPER_API_KEY nos Secrets do GitHub." && exit 1)

      - name: Gerar pauta, roteiro, imagens e áudio
        run: |
          python scripts/produce_radar_edition.py \
            --format shorts \
            --output-dir output/edition \
            --lookback-hours "${{ inputs.lookback_hours }}" \
            --max-articles "${{ inputs.max_articles }}"

      - name: Montar vídeo MP4 com FFmpeg
        run: |
          headline="$(python -c 'import json; print(json.load(open("output/edition/manifest.json"))["headline"])')"
          edition_date="$(python -c 'import json; print(json.load(open("output/edition/manifest.json"))["edition_date"])')"
          python scripts/render_radar_video.py \
            --audio output/edition/audio.wav \
            --images output/edition/images \
            --headline "$headline" \
            --date "$edition_date" \
            --format shorts \
            --output-dir output/video

      - name: Disponibilizar edição para revisão manual
        uses: actions/upload-artifact@v4
        with:
          name: radar-youtube-short-${{ github.run_number }}
          path: |
            output/edition/
            output/video/*.mp4
          if-no-files-found: error
          retention-days: 7
