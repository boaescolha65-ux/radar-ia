name: Radar Diário — produção de vídeo

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: "Caminho do manifesto JSON"
        required: true
        default: "video/manifest.json"
        type: string

permissions:
  contents: read

jobs:
  render:
    name: Montar vídeo com FFmpeg
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar FFmpeg e fontes
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Verificar ferramentas
        run: |
          ffmpeg -version
          ffprobe -version
          python3 --version

      - name: Montar telejornal
        run: |
          python3 scripts/build-radar-video.py \
            --manifest "${{ inputs.manifest_path }}" \
            --output output/radar-diario.mp4

      - name: Disponibilizar vídeo para revisão
        uses: actions/upload-artifact@v4
        with:
          name: radar-diario-video
          path: output/radar-diario.mp4
          if-no-files-found: error
          retention-days: 7
